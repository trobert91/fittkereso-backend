environment: "development"
port: 8088
service_type: webserver

mongo:
  url: mongodb://root:root@localhost:27017/?authMechanism=DEFAULT

postgres:
  host: 127.0.0.1
  port: 5432
  user: fittkereso
  password: fittkereso
  database: fittkereso
  sync: true
  run_migrations: true
  ssl: false
  # Optional. The collector defaults to 50: every concurrent import holds a
  # connection for its product lock on top of the ones it queries with.
  # pool_size: 50

app_settings:
  app_url: https://app.fittkereso.com

  api:
    api_key: fittkereso-test
    api_secret: testApiKey

exa:
  api_key: your-exa-api-key-here
  api_url: https://api.exa.ai
